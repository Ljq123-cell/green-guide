<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GreenGuide - 统一登录</title>
<style>
:root{--primary:#059669;--phover:#047857;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--sub:#94a3b8;--border:#e2e8f0;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text)}
.wrap{width:420px}
.card{background:var(--card);border-radius:var(--radius);padding:40px 36px;box-shadow:0 4px 32px rgba(0,0,0,.07);border:1px solid var(--border)}
.card .logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.card .logo .icon{font-size:28px}
.card .logo h1{font-size:20px;font-weight:700;color:var(--text)}
.card .sub{text-align:center;font-size:13px;color:var(--sub);margin-bottom:28px}
.card label{display:block;font-size:13px;font-weight:600;color:#475569;margin:14px 0 5px}
.card input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:15px;color:var(--text);background:#f8fafc;transition:.2s}
.card input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
.card button{width:100%;margin-top:22px;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.card button:hover{background:var(--phover);box-shadow:0 4px 16px rgba(5,150,105,.2)}
.card button:disabled{opacity:.6;cursor:default}
.card .links{display:flex;justify-content:space-between;margin-top:16px;font-size:12px}
.card .links a{color:var(--primary);text-decoration:none}
.card .hint{margin-top:8px;text-align:center;font-size:11px;color:var(--sub)}
#err{text-align:center;color:#dc2626;font-size:13px;margin-top:10px;display:none}
.foot{text-align:center;margin-top:16px;font-size:12px;color:var(--sub)}
/* Tab switcher */
.tab-row{display:flex;gap:0;margin-bottom:24px;background:#f1f5f9;border-radius:10px;padding:3px}
.tab-row button{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;font-size:13px;font-weight:500;cursor:pointer;color:#64748b;transition:.2s}
.tab-row button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo"><span class="icon">🌿</span><h1>GreenGuide</h1></div>
    <div class="sub">智能垃圾分类AI教育科普助手</div>

    <div class="tab-row">
      <button class="active" data-mode="all" onclick="switchTab('all')">统一登录</button>
      <button data-mode="admin" onclick="switchTab('admin')">管理员</button>
      <button data-mode="user" onclick="switchTab('user')">普通用户</button>
    </div>

    <label>用户名 / 账号</label>
    <input id="username" placeholder="管理员输入 admin，普通用户输入昵称" value="admin" autofocus>

    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码" value="admin123">

    <button id="loginBtn" onclick="doLogin()">登 录</button>
    <div id="err"></div>

    <div class="hint" id="hint">管理员: admin / admin123 &nbsp;|&nbsp; 普通用户: 环保小明 / user123 &nbsp;|&nbsp; 其他示例用户密码: test</div>
  </div>
  <div class="foot">统一账号登录 · 智能识别身份</div>
</div>

<script>
const API='/api/v1/public/unified-login';
let currentTab='all';

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-row button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-mode="${tab}"]`).classList.add('active');
  const u=document.getElementById('username'),p=document.getElementById('password'),h=document.getElementById('hint');
  if(tab==='admin'){u.value='admin';p.value='admin123';h.innerHTML='管理员: admin / admin123';}
  else if(tab==='user'){u.value='环保小明';p.value='user123';h.innerHTML='普通用户: 环保小明 / user123 &nbsp;|&nbsp; 其他示例用户密码: test';}
  else{u.value='admin';p.value='admin123';h.innerHTML='管理员: admin / admin123 &nbsp;|&nbsp; 普通用户: 环保小明 / user123 &nbsp;|&nbsp; 其他示例用户密码: test';}
  document.getElementById('err').style.display='none';
}

async function doLogin(){
  const btn=document.getElementById('loginBtn'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='登录中...';err.style.display='none';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d=await r.json();
    if(d.code===200){
      const data=d.data;
      // Store token
      localStorage.setItem('gg_token',data.token);
      localStorage.setItem('gg_user',JSON.stringify(data));
      btn.textContent='登录成功 ✓';
      // Jump based on role
      if(data.role==='ADMIN'||data.role==='EDITOR'){
        setTimeout(()=>window.location.href='/admin.html',600);
      }else{
        setTimeout(()=>window.location.href='/index.html',600);
      }
    }else{
      err.textContent=d.message||'登录失败';err.style.display='block';
      btn.textContent='登 录';btn.disabled=false;
    }
  }catch(e){
    err.textContent='网络错误，请检查服务是否启动';err.style.display='block';
    btn.textContent='登 录';btn.disabled=false;
  }
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
